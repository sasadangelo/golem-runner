# values.yaml
controllers:
  github-mcp:
    type: deployment
    replicas: 1
    containers:
      main:
        image:
          repository: ghcr.io/github/github-mcp-server
          tag: latest
          pullPolicy: IfNotPresent
        args:
          - http
          - --port
          - "8000"
          - --gh-host
          - "https://github.ibm.com"
          - --toolsets
          - "repos,issues,pull_requests,actions,code_security"
        envFrom:
          - secretRef:
              name: github-mcp-credentials
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

service:
  main:
    controller: github-mcp
    ports:
      http:
        port: 8000

