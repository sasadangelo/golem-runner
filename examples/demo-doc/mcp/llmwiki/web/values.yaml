# Helm values for the llmwiki web UI (bjw-s/app-template).
#
# The UI is a stateless Next.js container.  API_URL and MCP_URL are
# baked in at build time; the runtime env vars below are for the Node.js
# server-side layer only.

controllers:
  llmwiki-web:
    type: deployment
    replicas: 1
    containers:
      main:
        image:
          repository: localhost/llmwiki-web
          tag: latest
          pullPolicy: IfNotPresent
        env:
          PORT: "3000"
          NODE_ENV: "production"
          HOSTNAME: "0.0.0.0"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

service:
  main:
    controller: llmwiki-web
    ports:
      http:
        port: 3000
