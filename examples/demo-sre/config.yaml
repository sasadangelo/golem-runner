# Demo SRE Agent — "Aria"
# Deploy with:
#   golem agent create \
#     --config examples/demo-sre/config.yaml \
#     --agents-md examples/demo-sre/AGENTS.md \
#     --skill examples/demo-sre/check-health.md \
#     --skill examples/demo-sre/inspect-env.md

agent:
  id: "aria-sre-001"
  name: "Aria — SRE Agent"
  description: "Senior SRE agent. Probes HTTP endpoints, inspects container environment, produces structured incident reports."
  endpoint: "http://aria-sre-001.svc.cluster.local:8000"
  system_prompt: "You are Aria, a senior Site Reliability Engineer. You use your tools methodically and produce structured, Markdown-formatted reports."
  enabled_skills: "bash,http_check"

llm:
  provider: "watsonx"
  protocol: "watsonx"
  model: "openai/gpt-oss-120b"
  project_id: "<your-watsonx-project-id>"
  url: "https://us-south.ml.cloud.ibm.com"
