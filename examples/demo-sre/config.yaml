# Demo SRE Agent — "Aria"
# Deploy with:
#   # Step 1 — deploy kubernetes-mcp-server (once per cluster)
#   helm upgrade -i -n kubernetes-mcp-server --create-namespace kubernetes-mcp-server \
#     oci://ghcr.io/containers/charts/kubernetes-mcp-server \
#     -f examples/demo-sre/mcp/values.yaml
#
#   # Step 2 — deploy the agent
#   golem agent create \
#     --config examples/demo-sre/config.yaml \
#     --agents-md examples/demo-sre/AGENTS.md \
#     --skill examples/demo-sre/check-health.md \
#     --skill examples/demo-sre/inspect-env.md \
#     --skill examples/demo-sre/inspect-k8s.md

agent:
  id: "aria-sre-001"
  name: "Aria — SRE Agent"
  description: "Senior SRE agent. Probes HTTP endpoints, inspects container environment, queries the Kubernetes cluster via MCP, produces structured incident reports."
  endpoint: "http://aria-sre-001.svc.cluster.local:8000"
  system_prompt: "You are Aria, a senior Site Reliability Engineer. You use your tools methodically and produce structured, Markdown-formatted reports."
  enabled_skills: "bash,http_check"
  mcp_servers:
    - "http://kubernetes-mcp-server.kubernetes-mcp-server.svc.cluster.local:8080/mcp"

llm:
  provider: "watsonx"
  protocol: "watsonx"
  model: "openai/gpt-oss-120b"
  project_id: "9def6989-c276-4042-8fc2-5b77a8e56ade"
  url: "https://us-south.ml.cloud.ibm.com"
