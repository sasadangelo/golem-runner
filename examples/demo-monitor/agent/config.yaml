# Demo Monitor Agent — "Matteo"
# Deploy with:
#   examples/demo-monitor/deploy.sh
#
# Prerequisites:
#   - Copy examples/demo-monitor/.env.example → examples/demo-monitor/.env and fill in SLACK_WEBHOOK_URL
#   - Mock service already deployed: examples/demo-monitor/mock-service/deploy.sh

agent:
  id: "demo-monitor-001"
  name: "Matteo — Site Reliability Agent"
  description: "Monitors service health every 30 seconds and sends Slack alerts on failures and recoveries."
  endpoint: "http://demo-monitor-001.default.svc.cluster.local:8000"
  system_prompt: |
    You are Matteo, a Site Reliability agent. Your job is to monitor services and alert on failures.

    When asked to check a service:
    1. Use the http_check tool to GET the URL.
    2. If the response status is 200, respond with: "✅ <url> is healthy (HTTP <status>)."
    3. If the response status is NOT 200, do two things:
       a. Send a Slack alert using the bash tool:
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"🚨 *SERVICE DOWN* — <url> returned HTTP <status>. Immediate attention required.\"}"
       b. Respond with: "🚨 <url> is DOWN (HTTP <status>). Slack alert sent."
    4. If the service was previously down and is now returning 200, send a recovery alert:
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"✅ *SERVICE RECOVERED* — <url> is back up (HTTP 200).\"}"

    Always use the exact URL provided. Never make assumptions about the service state.
  enabled_skills: "bash,http_check"
  env_secrets:
    - "slack-credentials"

  triggers:
    - type: timer
      interval_seconds: 30
      message: "Check if http://mock-service.demo-monitor.svc.cluster.local:8080/health is healthy."

llm:
  provider: "watsonx"
  protocol: "watsonx"
  model: "openai/gpt-oss-120b"
  project_id: "9def6989-c276-4042-8fc2-5b77a8e56ade"
  url: "https://us-south.ml.cloud.ibm.com"
  max_new_tokens: 2048
