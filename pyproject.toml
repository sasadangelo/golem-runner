[project]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "langgraph>=0.0.30",
  "langchain-ibm>=0.3.0",
  "langchain-core>=0.1.30",
  "pydantic>=2.6.0",
  "pydantic-settings[yaml]>=2.2.0",
  "pyyaml>=6.0",
  "httpx>=0.27.0",
  "websockets>=12.0",
  "langchain-mcp-adapters>=0.1.0",
  "croniter>=2.0",
]
description = "Generic Agent Runner — configurable via environment variables"
name = "golem-runner"
requires-python = ">=3.12,<3.15"
version = "0.1.0"

[dependency-groups]
dev = [
  "ruff>=0.4.0",
  "pyright>=1.1.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/golem-runner"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # pycodestyle, pyflakes, isort, pyupgrade

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/golem-runner", "src/golem_agent_sdk", "src/golem_framework"]
